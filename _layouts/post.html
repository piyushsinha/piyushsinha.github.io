---
layout: default
---

<section class="section">
  <div class="container" style="margin-bottom: var(--space-5);">
    <!-- Post Header -->
    <div style="margin-bottom: var(--space-4);">
      <span class="label" style="display: inline-block; margin-bottom: var(--space-2);">Thinking</span>
      <h1>{{ page.title }}</h1>
      {% if page.date %}
        <p class="caption" style="margin-top: var(--space-1);">{{ page.date | date: "%B %d, %Y" }}</p>
      {% endif %}
    </div>

    <!-- Post Hero Image -->
    {% if page.image %}
      <div class="post-hero" style="margin-bottom: var(--space-5);">
        <div class="featured-image" style="border: none; box-shadow: none; border-radius: var(--radius-md); overflow: hidden;">
          <img src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}" style="width: 100%; height: auto; object-fit: cover;" fetchpriority="high">
        </div>
      </div>
    {% endif %}

    <!-- Post Content -->
    <div class="entry-content">
      {{ content }}
    </div>

    <!-- Back to Thinking -->
    <hr class="separator" style="margin-top: var(--space-6);">
    <p style="margin-top: var(--space-4);"><a href="{{ '/thinking/' | relative_url }}">&larr; Back to all posts</a></p>
  </div>
</section>
