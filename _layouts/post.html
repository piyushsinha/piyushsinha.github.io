layout: default
---

<div class="container--wide has-padding" style="margin-bottom:var(--space-50)">
  <h1 class="text-center">Thinking</h1>
  <p class="text-center">Out loud on design, product, and leadership — from the work, the field, and wherever curiosity takes me.</p>
  <hr class="separator separator--wavy">
</div>

<main class="container--narrow has-padding" style="margin-top:0;margin-bottom:0">
  <div class="post-hero">

    <div class="spacer" aria-hidden="true"></div>

    <h1>{{ page.title }}</h1>
  </div>

  <div class="spacer" aria-hidden="true"></div>

  <div class="entry-content">
    {{ content }}
  </div>

  <div class="spacer" aria-hidden="true"></div>

  <hr class="separator">
</main>
