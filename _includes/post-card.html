<li class="post-card">
  <div class="columns">
    {% if post.image %}
    <div class="column" style="flex-basis:40%">
      <figure style="aspect-ratio:4/5;width:100%;" class="featured-image">
        <a href="{{ post.url | relative_url }}">
          <img src="{{ post.image | relative_url }}" alt="{{ post.title | escape }}" style="width:100%;height:100%;object-fit:cover;" decoding="async">
        </a>
      </figure>
    </div>
    {% endif %}
    <div class="column" style="flex-basis:{% if post.image %}60{% else %}100{% endif %}%">
      <h2 class="post-card__title">
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </h2>
      {% if post.description %}
      <div class="post-card__excerpt">
        <p>{{ post.description | truncate: 200 }}</p>
      </div>
      {% endif %}
    </div>
  </div>
</li>
