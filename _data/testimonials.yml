- quote: >
    I had the opportunity to work directly with Piyush for a year as our Head of Product Design. Piyush's deep expertise in research and user experience design enable him to speak with authority on design-related topics and engage senior client stakeholders in the design process. Piyush strives to connect design decisions to supporting research, backing work up with data to convince on his recommendations. He is able to adapt his style to speak to both designer and non-designer audiences, and represented Appsynth well in public speaking engagements. During his time with us Piyush made efforts to improve team workflows, introduce new processes and reduce project turnaround times. With his extensive mentoring background, Piyush has proven to be a strong coach who's motivated to help others succeed. He also played an active role in supporting successful pitches in our BD process. Piyush has a positive can-do attitude and is willing to help on things outside of his normal scope of work when asked.
  name: "Robert (Bob) Gallagher"
  role: "Partner at Deloitte Digital"
  context: "Managed Piyush at Appsynth"

- quote: >
    Piyush led Brankas' UX function, including design, research and writing. An absolute professional in what he does, he was instrumental in leading the team to provide forward thinking user experience to improve trust of users in a brand-new space. On top of this, he spearheaded many product initiatives that required the involvement of a significant portion of the company, leading to increased usability of Brankas' products. I will always vouch for Piyush, and guarantee that wherever he finds himself in future he will accelerate the quality of products.
  name: "Mike Dickinson"
  role: "Chief Product Officer at Brankas"
  context: "Worked with Piyush at Brankas"

- quote: >
    Piyush was the expert of UX and had brought tremendous impact to Brankas product. Other than that, he continued to improve processes in the company, to result better products. He also cared about overall company problems, and being very helpful to facilitate every key person to produce solutions. I think that makes him "that guy". I truly recommended Piyush everywhere he goes, and I am grateful to had been working with him in Brankas.
  name: "Eri Marina Yo"
  role: "Head of Delivery & Supply Product at Brankas"
  context: "Worked with Piyush at Brankas"

- quote: >
    Piyush is a top notch UX researcher and a natural leader. Piyush started the UX function at Agoda. I worked with him at Agoda and he was my go to UX researcher when I was building the checkout experience. He would patiently listen to the needs and push my own thinking to improve the customer experience. His plans were detailed and the research reports are thoughtful. Piyush would be a valuable addition to any UX team looking for a leader to drive them to new heights of success.
  name: "Jay Sharma"
  role: "CTO at Amazon Marketplace (Canada)"
  context: "Worked with Piyush at Agoda"

- quote: >
    Piyush is truly a one-of-a-kind user experience research leader–one with a great deal of knowledge, who empowers his team with freedom in their work and above all else, has the ability to grow the impact of research within the org. His years of experience in the field, both design and research, is welcomed and his vast experience & knowledge of global markets is inspiring and impactful at all levels.
  name: "Deven Grover"
  role: "Senior Director, Global Product Design at Agoda"
  context: "Worked with Piyush at Agoda"
